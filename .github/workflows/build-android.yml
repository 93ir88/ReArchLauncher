name: Build ReArchLauncher (Qt Android Port)

on:
  push:
    branches: [ main, android-port ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  QT_VERSION:        '6.8.3'
  NDK_VERSION:       '27.0.12077973'
  ANDROID_API:       '29'
  ANDROID_ABIS:      'arm64-v8a'
  CMAKE_VERSION:     '3.29.0'

jobs:
  # ─── Build Android APK via Qt for Android ─────────────────────────────────
  build-android-apk:
    name: Qt6 Android Cross-Compile → APK
    runs-on: ubuntu-24.04

    steps:
      # ── Checkout (includes caelestia/shell + hyperland/ source trees) ───
      - name: Checkout ReArchLauncher
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Ensure source trees exist (submodule init + fallback clone) ─────
      - name: Init source trees
        run: |
          git submodule update --init --recursive --depth 1 2>/dev/null || true

          if [ ! -f "caelestia/shell/CMakeLists.txt" ]; then
            echo "caelestia/shell missing, cloning..."
            rm -rf caelestia/shell
            git clone --depth 1 https://github.com/caelestia-dots/shell.git caelestia/shell
          fi

          if [ ! -d "hyperland/Hyprland" ]; then
            echo "hyperland/Hyprland missing, cloning..."
            mkdir -p hyperland
            git clone --depth 1 https://github.com/hyprwm/Hyprland.git hyperland/Hyprland
          fi

          echo "Sources ready:"
          ls caelestia/shell | head -8

      # ── Java (required by Android SDK) ──────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK + NDK ───────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "platforms;android-35"
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # ── Qt 6 for Android (arm64-v8a) ────────────────────────────────────
      - name: Cache Qt6 Android
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt6-android
          key: qt6-${{ env.QT_VERSION }}-android-arm64-${{ runner.os }}

      - name: Install Qt6 for Android
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         'linux'
          target:       'android'
          arch:         'android_arm64_v8a'
          dir:          '${{ runner.temp }}/qt6-android'
          install-deps: 'true'
          modules:      'qtmultimedia qtshadertools'
          cache:        true

      # Also install Qt6 for the host (needed by qt-cmake cross-compile)
      - name: Install Qt6 host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host:    'linux'
          target:  'desktop'
          arch:    'linux_gcc_64'
          dir:     '${{ runner.temp }}/qt6-host'
          modules: 'qtshadertools'
          cache:   true

      # ── System dependencies (libqalculate for calculator widget) ────────
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ninja-build cmake \
            libqalculate-dev \
            pkg-config

      # ── Configure + Build ────────────────────────────────────────────────
      - name: Configure CMake (Android cross-compile)
        run: |
          QT_ANDROID="${{ runner.temp }}/qt6-android/Qt/${{ env.QT_VERSION }}/android_arm64_v8a"
          QT_HOST="${{ runner.temp }}/qt6-host/Qt/${{ env.QT_VERSION }}/gcc_64"

          # NDK toolchain sets FIND_ROOT_PATH_MODE_PACKAGE=ONLY by default,
          # which makes CMAKE_PREFIX_PATH invisible. We bypass this by:
          #   1. Pointing Qt6_DIR directly at lib/cmake/Qt6
          #   2. Setting FIND_ROOT_PATH_MODE_PACKAGE=BOTH
          cmake -S android-cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.NDK_PATH }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ env.ANDROID_ABIS }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DQT_HOST_PATH="$QT_HOST" \
            -DQt6_DIR="$QT_ANDROID/lib/cmake/Qt6" \
            -DCMAKE_FIND_ROOT_PATH="$QT_ANDROID" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="${{ env.NDK_PATH }}" \
            -DVERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo '1.0.0')" \
            -DGIT_REVISION="$(git rev-parse --short HEAD)" \
            -DANDROID=ON

      - name: Build APK
        run: |
          cmake --build build --target apk -j$(nproc)

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Find APK
        id: find-apk
        run: |
          APK=$(find build -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReArchLauncher-${{ github.sha }}-arm64
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

      # ── Also build Magisk module ─────────────────────────────────────────
      - name: Package Magisk module
        run: |
          cd magisk-module
          zip -r ../ReArch-Magisk-Module.zip META-INF module.prop system post-fs-data.sh service.sh
          cd ..

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: ReArch-Magisk-Module
          path: ReArch-Magisk-Module.zip
          retention-days: 30

  # ─── GitHub Release on version tags ──────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-android-apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          pattern: ReArchLauncher-*
          merge-multiple: true
          path: release/

      - name: Download Magisk module
        uses: actions/download-artifact@v4
        with:
          name: ReArch-Magisk-Module
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## ReArchLauncher ${{ github.ref_name }}

            **Caelestia Shell + Hyprland → Android port**

            Real QML from `caelestia/shell` running via Qt 6 Android.
            Hyprland IPC replaced with Android WindowManager.
            PipeWire replaced with Android AudioRecord.

            ### Requirements
            - Android 10+ (API 29+)
            - Magisk or KernelSU *(for freeform windows + permissions)*
            - Enable accessibility service after install

            ### Install
            1. Flash `ReArch-Magisk-Module.zip` via Magisk/TWRP
            2. Install `ReArchLauncher-*.apk`
            3. Set as default Home app
            4. Grant accessibility permission → *Settings → Accessibility → ReArch Keybinds*
            5. Reboot

            ### Keybinds (Hyprland-style)
            | Bind | Action |
            |------|--------|
            | SUPER + 1–4 | Switch workspace |
            | SUPER + Q | Close focused window |
            | SUPER + F | Toggle fullscreen |
            | SUPER + ENTER | Open app launcher |
            | SUPER + Space | Media play/pause |
            | SUPER + H/J/K/L | Focus window direction |
            | SUPER + TAB | Cycle windows |
